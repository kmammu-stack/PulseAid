version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: disaster_db
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_pass
      POSTGRES_DB: disaster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: disaster_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: